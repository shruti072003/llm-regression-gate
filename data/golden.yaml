# Golden dataset: ground truth for the email classifier.
#
# Provenance: the 60 cases below were drafted by Claude (an LLM) following the labeling
# policy in DECISIONS.md, and are marked `reviewed: false`. A human must check each label
# and set `reviewed: true` before results on that case are fully trusted.
#
# Rules
# - Labels follow the labeling policy in DECISIONS.md. If unsure, decide the rule, write it there, then label.
# - Never reuse an email from a prompt's few-shot examples or from scripts/smoke_test.py (tests enforce this).
# - IDs are permanent: never renumber or reuse one. Remove a case by deleting it; its ID stays retired.
# - Bump `version` whenever you add, remove or relabel a case (after the first baseline run).
# - Aim for about 15 cases per category. Run `uv run python scripts/dataset_stats.py` to check the balance.
#
# Fictional product used throughout: Planwise, a project-management app with Free, Pro and
# Team plans, a web dashboard, iOS and Android apps, Gantt and timeline views, CSV/PDF export,
# Slack and Google Calendar integrations, Google/Okta SSO, and a public API.
#
# Case format:
#
# - id: case-001
#   email: |
#     The email, exactly as a customer would write it.
#   expected_category: billing        # billing | technical | account | general
#   key_facts:                        # 1-3 facts a correct summary must mention
#     - first fact
#   difficulty: easy                  # easy | medium | hard
#   tags: []                          # ambiguous, policy_boundary, multi_topic, very_short,
#                                     # typos, mixed_language, sarcasm
#   notes: Why this case matters and why it has this label.   # required if hard or tagged
#   reviewed: false                   # true once a human has checked the label

version: 1
description: Initial golden set of 60 cases (15 per category), drafted by Claude, pending human review.
