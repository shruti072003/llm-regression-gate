[project]
name = "llm-regression-gate"
version = "0.1.0"
description = "llm regression detector gate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "regression_gate"