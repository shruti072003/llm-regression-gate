# The regression gate. On every PR that can change model behavior, run the golden dataset
# twice, once with main's code, prompt and dataset (baseline) and once with the PR's
# (candidate), compare, comment on the PR, and fail the check on FAIL or INVALID.
#
# Running the baseline fresh in the same job (instead of reusing an old result) means both
# runs hit the same served model snapshot and share one judge cache, so a provider-side
# model change or judge noise can't show up as a regression in the PR.
#
# `gate` is a required check on main, so it runs on every PR. PRs that change nothing that
# can affect model behavior pass in seconds without calling the API.
name: eval gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check whether the PR can change model behavior
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          relevant=$(echo "$files" | grep -E '^(prompts/|src/|data/|gate\.yaml$|pyproject\.toml$|uv\.lock$)' || true)
          if [ -n "$relevant" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            printf 'Model-affecting changes:\n%s\n' "$relevant"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No prompt, code, data, settings or dependency changes: eval skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require the API key
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set (PRs from forks don't get secrets)."
            exit 1
          fi

      - name: Check out the PR (candidate)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out main (baseline)
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.relevant == 'true'
        with:
          enable-cache: true

      - name: Run baseline
        if: steps.changes.outputs.relevant == 'true'
        working-directory: base
        run: |
          uv sync --frozen
          uv run gate --db "$GITHUB_WORKSPACE/gate.db" run --out "$GITHUB_WORKSPACE/out/baseline.json"

      - name: Run candidate
        if: steps.changes.outputs.relevant == 'true'
        working-directory: head
        run: |
          uv sync --frozen
          uv run gate --db "$GITHUB_WORKSPACE/gate.db" run --out "$GITHUB_WORKSPACE/out/candidate.json"

      - name: Compare
        if: steps.changes.outputs.relevant == 'true'
        id: compare
        working-directory: head
        run: |
          set +e
          uv run gate --db "$GITHUB_WORKSPACE/gate.db" compare \
            "$GITHUB_WORKSPACE/out/baseline.json" "$GITHUB_WORKSPACE/out/candidate.json" \
            --report "$GITHUB_WORKSPACE/out/report.html" \
            --comment "$GITHUB_WORKSPACE/out/comment.md" \
            --json "$GITHUB_WORKSPACE/out/comparison.json" \
            --report-url "$RUN_URL" --slack
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_WORKSPACE/out/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: out/

      - name: Comment on the PR
        if: always() && steps.compare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Update the gate's existing comment instead of adding one per push.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- regression-gate-report -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@out/comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file out/comment.md
          fi

      - name: Block merge on FAIL or INVALID
        if: steps.changes.outputs.relevant == 'true' && steps.compare.outputs.exit_code != '0'
        run: |
          echo "::error::Regression gate result is FAIL or INVALID (exit ${{ steps.compare.outputs.exit_code }}). See the PR comment and the regression-report artifact."
          exit 1
